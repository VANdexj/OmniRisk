<svg xmlns="http://www.w3.org/2000/svg" width="424" height="312" viewBox="0 0 424 312" role="img" aria-label="Success rate vs obstacle speed with six obstacles, n = 50. OmniRisk: 96% at 2 m/s, 90% at 6 m/s, 84% at 10 m/s. FAPP: 74%, 40%, 8%. SIMP: 66%, 0%, 0%.">
  <style>
    .ink { fill: #1f2328 } .sub { fill: #59636e } .legend { fill: #3d444d } .grid { stroke: #eaeef2 } .halo { stroke: #ffffff }
    .omni { stroke: #6b5bd2 } .omni-f { fill: #6b5bd2 }
    .fapp { stroke: #0b8a70 } .fapp-f { fill: #0b8a70 }
    .simp { stroke: #b0892b } .simp-f { fill: #b0892b }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3 } .sub { fill: #9198a1 } .legend { fill: #c9d1d9 } .grid { stroke: #262c36 } .halo { stroke: #0d1117 }
      .omni { stroke: #8f82f0 } .omni-f { fill: #8f82f0 }
      .fapp { stroke: #2e9f87 } .fapp-f { fill: #2e9f87 }
      .simp { stroke: #b58a30 } .simp-f { fill: #b58a30 }
    }
  </style>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="12" y="22" font-size="14" font-weight="600" class="ink">Success rate vs. obstacle speed <tspan font-weight="400" class="sub">(6 obstacles, n = 50)</tspan></text>
    <g font-size="12" class="legend">
      <rect x="12" y="41.5" width="14" height="3" rx="1.5" class="omni-f"/><text x="32" y="47">OmniRisk</text>
      <rect x="98" y="41.5" width="14" height="3" rx="1.5" class="fapp-f"/><text x="118" y="47">FAPP</text>
      <rect x="162" y="41.5" width="14" height="3" rx="1.5" class="simp-f"/><text x="182" y="47">SIMP</text>
    </g>
    <g transform="translate(6 62)">
      <g stroke-width="1" class="grid">
        <line x1="40" y1="216" x2="322" y2="216"/>
        <line x1="40" y1="165.5" x2="322" y2="165.5"/>
        <line x1="40" y1="115" x2="322" y2="115"/>
        <line x1="40" y1="64.5" x2="322" y2="64.5"/>
        <line x1="40" y1="14" x2="322" y2="14"/>
      </g>
      <g font-size="11" class="sub">
        <g text-anchor="end">
          <text x="32" y="220">0</text>
          <text x="32" y="169.5">25</text>
          <text x="32" y="119">50</text>
          <text x="32" y="68.5">75</text>
          <text x="32" y="18">100</text>
        </g>
        <g text-anchor="middle">
          <text x="40" y="238">2 m/s</text>
          <text x="181" y="238">6 m/s</text>
          <text x="322" y="238">10 m/s</text>
        </g>
      </g>
      <g fill="none" stroke-linejoin="round" stroke-linecap="round">
        <polyline points="40,82.7 181,216 322,216" stroke-width="2" class="simp"/>
        <polyline points="40,66.5 181,135.2 322,199.8" stroke-width="2" class="fapp"/>
        <polyline points="40,22.1 181,34.2 322,46.3" stroke-width="3" class="omni"/>
      </g>
      <g stroke-width="2" class="halo">
        <circle cx="40" cy="82.7" r="4.5" class="simp-f"/><circle cx="181" cy="216" r="4.5" class="simp-f"/><circle cx="322" cy="216" r="4.5" class="simp-f"/>
        <circle cx="40" cy="66.5" r="4.5" class="fapp-f"/><circle cx="181" cy="135.2" r="4.5" class="fapp-f"/><circle cx="322" cy="199.8" r="4.5" class="fapp-f"/>
        <circle cx="40" cy="22.1" r="4.5" class="omni-f"/><circle cx="181" cy="34.2" r="4.5" class="omni-f"/><circle cx="322" cy="46.3" r="4.5" class="omni-f"/>
      </g>
      <g font-size="12" class="ink">
        <text x="332" y="221">SIMP 0%</text>
        <text x="332" y="197.8">FAPP 8%</text>
        <text x="332" y="50.3" font-weight="600">OmniRisk 84%</text>
      </g>
    </g>
  </g>
</svg>
